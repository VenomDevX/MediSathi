# Local PostgreSQL for the MediSaathi API. Dev only: change the password for anything shared.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medisaathi
      POSTGRES_USER: medisaathi
      POSTGRES_PASSWORD: medisaathi-dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
